<section class="lesson-section lesson-section--challenge"><h2>17. Desafio</h2><p>O desafio simula um chamado em que um usuário conectado por cabo não acessa sistemas internos. Você precisará montar hipóteses de Camada 1, Camada 2 e Camada 3, indicar evidências e propor uma sequência segura de investigação.</p></section>
