<section class="lesson-section lesson-section--diagram"><h2>Diagrama</h2><svg class="lesson-svg" viewBox="0 0 980 520" role="img" aria-labelledby="m03l01-title m03l01-desc"><title id="m03l01-title">Ethernet na rede local cabeada</title><desc id="m03l01-desc">Host envia um frame Ethernet para o switch, que aprende o MAC de origem e encaminha para o gateway ou servidor local.</desc><defs><marker id="m03l01-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" class="svg-arrow" /></marker></defs><rect x="40" y="110" width="160" height="82" rx="14" class="svg-node svg-node--client"/><text x="120" y="143" text-anchor="middle" class="svg-label">Host</text><text x="120" y="168" text-anchor="middle" class="svg-label svg-label--small">MAC origem</text><rect x="285" y="110" width="180" height="82" rx="14" class="svg-node svg-node--switch"/><text x="375" y="143" text-anchor="middle" class="svg-label">Switch</text><text x="375" y="168" text-anchor="middle" class="svg-label svg-label--small">Tabela MAC</text><rect x="565" y="70" width="170" height="82" rx="14" class="svg-node svg-node--router"/><text x="650" y="103" text-anchor="middle" class="svg-label">Gateway</text><text x="650" y="128" text-anchor="middle" class="svg-label svg-label--small">Próximo salto</text><rect x="565" y="205" width="170" height="82" rx="14" class="svg-node svg-node--server"/><text x="650" y="238" text-anchor="middle" class="svg-label">Servidor local</text><text x="650" y="263" text-anchor="middle" class="svg-label svg-label--small">Mesmo domínio</text><rect x="790" y="125" width="150" height="88" rx="14" class="svg-node svg-node--security"/><text x="865" y="158" text-anchor="middle" class="svg-label">Controles</text><text x="865" y="183" text-anchor="middle" class="svg-label svg-label--small">VLAN / NAC</text><line x1="200" y1="151" x2="285" y2="151" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m03l01-arrow)"/><line x1="465" y1="140" x2="565" y2="112" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m03l01-arrow)"/><line x1="465" y1="165" x2="565" y2="246" class="svg-flow svg-flow--response animated-flow" marker-end="url(#m03l01-arrow)"/><line x1="735" y1="151" x2="790" y2="169" class="svg-flow svg-flow--blocked animated-flow" marker-end="url(#m03l01-arrow)"/><rect x="80" y="350" width="820" height="92" rx="16" class="svg-zone"/><text x="490" y="382" text-anchor="middle" class="svg-label">Frame Ethernet</text><text x="490" y="412" text-anchor="middle" class="svg-label svg-label--small">MAC destino | MAC origem | EtherType | Dados encapsulados | FCS</text></svg><p>Na LAN cabeada, o host transmite frames Ethernet. O switch aprende o MAC de origem, encaminha o frame para o gateway ou para o servidor local e participa de controles como VLAN, autenticação (NAC) e segmentação.</p></section>
