
<section class="lesson-section lesson-section--diagram">

    <title id="m00l07-title">Protocolo como contrato de comunicação</title>
    <desc id="m00l07-desc">Diagrama mostrando cliente e servidor trocando mensagens com formato, ordem, estado, timeout, erro e segurança.</desc>
    <defs>
      <marker id="m00l07-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">

    </defs>
    <rect x="45" y="150" width="150" height="80" rx="14" class="svg-node svg-node--client" />
    <text x="120" y="184" text-anchor="middle" class="svg-label">Cliente</text>
    <text x="120" y="207" text-anchor="middle" class="svg-label svg-label--small">implementação A</text>
    <rect x="785" y="150" width="150" height="80" rx="14" class="svg-node svg-node--server" />
    <text x="860" y="184" text-anchor="middle" class="svg-label">Servidor</text>

    <text x="490" y="72" text-anchor="middle" class="svg-label">Contrato do protocolo</text>

    <text x="490" y="232" text-anchor="middle" class="svg-label svg-label--small">mensagem 2: status, dados ou erro</text>

  </svg>
