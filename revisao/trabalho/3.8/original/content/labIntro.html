<section class="lesson-section lesson-section--lab"><h2>15. Laboratório</h2>
<p>O laboratório desta aula é defensivo e pode ser feito como análise, Packet Tracer/GNS3 ou em ambiente corporativo com permissão. O objetivo é identificar onde haveria loop, qual switch deveria ser root bridge e quais evidências indicariam STP atuando.</p>
