<section class="lesson-section lesson-section--diagram"><h2>14. Diagrama SVG</h2>

<title id="m03l08-title">STP bloqueando um caminho redundante para evitar loop</title>
<desc id="m03l08-desc">Três switches formam um triângulo físico. O STP elege uma raiz e bloqueia um dos caminhos para manter uma árvore lógica sem ciclos.</desc>
<defs><marker id="m03l08-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" class="svg-arrow" /></marker></defs>
<rect x="380" y="60" width="200" height="82" rx="14" class="svg-node svg-node--switch" />
<text x="480" y="96" text-anchor="middle" class="svg-label">Switch A</text><text x="480" y="122" text-anchor="middle" class="svg-label svg-label--small">Root bridge</text>
<rect x="120" y="320" width="200" height="82" rx="14" class="svg-node svg-node--switch" />
<text x="220" y="356" text-anchor="middle" class="svg-label">Switch B</text><text x="220" y="382" text-anchor="middle" class="svg-label svg-label--small">Root port ativa</text>
<rect x="640" y="320" width="200" height="82" rx="14" class="svg-node svg-node--switch" />
<text x="740" y="356" text-anchor="middle" class="svg-label">Switch C</text><text x="740" y="382" text-anchor="middle" class="svg-label svg-label--small">Porta alternativa</text>
<line x1="380" y1="130" x2="285" y2="320" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m03l08-arrow)" />
<line x1="580" y1="130" x2="675" y2="320" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m03l08-arrow)" />
<line x1="320" y1="360" x2="640" y2="360" class="svg-flow svg-flow--blocked" />
<text x="480" y="345" text-anchor="middle" class="svg-label svg-label--small">link físico redundante</text>
<text x="480" y="382" text-anchor="middle" class="svg-label svg-label--small">STP bloqueia logicamente para evitar loop</text>
<rect x="70" y="455" width="820" height="44" rx="12" class="svg-zone" />
<text x="480" y="483" text-anchor="middle" class="svg-label svg-label--small">Redundância física permanece; topologia lógica ativa vira uma árvore sem ciclos.</text>
