<section class="lesson-section lesson-section--lab"><h2>15. Laboratório</h2>
<p>O laboratório desta aula coleta evidências IPv4 básicas do host e constrói a primeira matriz de decisão: IP próprio, máscara, gateway, destino local, destino remoto e rota padrão. O objetivo não é “decorar comando”, mas aprender a interpretar o que cada evidência permite concluir.</p>
