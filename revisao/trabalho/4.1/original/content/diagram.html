<section class="lesson-section lesson-section--diagram"><h2>14. Diagrama SVG</h2>
<svg class="lesson-svg" viewBox="0 0 980 420" role="img" aria-labelledby="m04l01-title m04l01-desc">
  <title id="m04l01-title">IPv4 como endereçamento lógico entre redes</title>
  <desc id="m04l01-desc">Um host envia um pacote IPv4 para outra rede usando o gateway local, enquanto Ethernet troca os endereços MAC a cada enlace.</desc>
  <defs>
    <marker id="m04l01-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" class="svg-arrow" /></marker>
  </defs>
  <rect x="40" y="145" width="150" height="80" rx="14" class="svg-node svg-node--client" />
  <text x="115" y="178" text-anchor="middle" class="svg-label">Host A</text>
  <text x="115" y="204" text-anchor="middle" class="svg-label svg-label--small">IP 192.168.10.20</text>
  <rect x="250" y="145" width="150" height="80" rx="14" class="svg-node svg-node--switch" />
  <text x="325" y="178" text-anchor="middle" class="svg-label">Switch LAN</text>
  <text x="325" y="204" text-anchor="middle" class="svg-label svg-label--small">Camada 2</text>
  <rect x="460" y="145" width="150" height="80" rx="14" class="svg-node svg-node--router" />
  <text x="535" y="178" text-anchor="middle" class="svg-label">Gateway</text>
  <text x="535" y="204" text-anchor="middle" class="svg-label svg-label--small">192.168.10.1</text>
  <rect x="690" y="145" width="150" height="80" rx="14" class="svg-node svg-node--server" />
  <text x="765" y="178" text-anchor="middle" class="svg-label">Servidor B</text>
  <text x="765" y="204" text-anchor="middle" class="svg-label svg-label--small">IP 10.20.30.40</text>
  <line x1="190" y1="185" x2="250" y2="185" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m04l01-arrow)" />
  <line x1="400" y1="185" x2="460" y2="185" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m04l01-arrow)" />
  <line x1="610" y1="185" x2="690" y2="185" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m04l01-arrow)" />
  <rect x="70" y="55" width="730" height="54" rx="12" class="svg-boundary" />
  <text x="435" y="87" text-anchor="middle" class="svg-label">Pacote IPv4 mantém IP origem 192.168.10.20 e IP destino 10.20.30.40</text>
  <rect x="70" y="285" width="730" height="60" rx="12" class="svg-zone" />
  <text x="435" y="312" text-anchor="middle" class="svg-label">Frames Ethernet mudam MAC origem/destino a cada enlace</text>
  <text x="435" y="335" text-anchor="middle" class="svg-label svg-label--small">IPv4 identifica origem/destino lógico; Ethernet entrega ao próximo salto local</text>
</svg>
</section>
