<section class="lesson-section lesson-section--challenge"><h2>17. Desafio</h2><p>O desafio final simula um chamado empresarial: uma aplicação interna está inacessível para parte dos usuários. Você deve montar uma análise por camadas, propor testes seguros, indicar logs necessários e explicar quando encaminhar para rede, segurança, identidade ou aplicação.</p></section>
