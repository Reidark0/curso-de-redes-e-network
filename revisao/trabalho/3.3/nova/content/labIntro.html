<section class="lesson-section lesson-section--lab"><h2>15. Laboratório</h2>
<p>O laboratório desta aula ensina a raciocinar como o switch: observar portas, MACs, VLANs e sintomas. Ele pode ser feito de forma conceitual/local e, opcionalmente, em Cisco Packet Tracer, GNS3 ou switch real autorizado. O foco é defensivo e não envolve ataques.</p>
