<section class="lesson-section lesson-section--lab"><h2>15. Laboratório</h2>
<p>O laboratório desta aula transforma endereços IPv4 em octetos, binário e validação prática. Você irá coletar o IP do seu host, separar os octetos, validar os limites numéricos e converter um endereço para binário usando PowerShell ou Python.</p>
