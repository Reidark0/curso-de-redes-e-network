<section class="lesson-section lesson-section--lab"><h2>15. Laboratório</h2>
<p>O laboratório desta aula é defensivo. Você não irá executar ataques. Você irá construir uma matriz de riscos, controles e evidências de L2 para uma LAN pequena, simulando como um analista de redes ou segurança documentaria a superfície de ataque local.</p>
