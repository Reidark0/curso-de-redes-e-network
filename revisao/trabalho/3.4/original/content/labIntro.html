<section class="lesson-section lesson-section--lab"><h2>15. Laboratório</h2>
<p>O laboratório desta aula orienta o aluno a mapear domínios de colisão e broadcast de forma segura em uma rede pequena ou em simulação. O objetivo não é gerar tráfego anormal, mas interpretar topologia, portas, VLANs e evidências.</p>
