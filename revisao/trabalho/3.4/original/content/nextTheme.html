<section class="lesson-section lesson-section--next"><h2>20. Próximo tema</h2>
<p>Na próxima aula estudaremos ARP: o mecanismo que permite ao IPv4 descobrir o endereço MAC do próximo salto dentro da rede local. Broadcast será essencial para entender por que ARP funciona e por que ARP spoofing existe como risco defensivo.</p>
