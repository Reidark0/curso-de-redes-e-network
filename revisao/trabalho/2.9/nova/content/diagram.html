el">2 Enlace: VLAN, MAC, NAC</text><rect x="355" y="392" width="270" height="55" rx="12" class="svg-node"/><text x="490" y="426" text-anchor="middle" class="svg-label">1 Física: rack, cabo, rádio</text><line x1="625" y1="420" x2="735" y2="420" class="svg-flow animated-flow" marker-end="url(#m02l09-arrow)"/><line x1="735" y1="420" x2="735" y2="52" class="svg-flow animated-flow" marker-end="url(#m02l09-arrow)"/><rect x="700" y="25" width="235" height="115" rx="16" class="svg-node svg-node--cloud"/><text x="817" y="62" text-anchor="middle" class="svg-label">Evidências</text><text x="817" y="88" text-anchor="middle" class="svg-label svg-label--small">logs + pacotes + eventos</text><text x="817" y="112" text-anchor="middle" class="svg-label svg-label--small">rede + IAM + aplicação</text><rect x="90" y="500" width="800" height="80" rx="18" class="svg-boundary"/><text x="490" y="532" text-anchor="middle" class="svg-label">Defesa em profundidade</text><text x="490" y="560" text-anchor="middle" class="svg-label svg-label--small">Cada camada reduz risco, gera evidência e possui limites. Segurança madura combina camadas, não aposta tudo em uma só.</text></svg></section>
