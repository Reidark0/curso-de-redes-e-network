<section class="lesson-section lesson-section--lab"><h2>15. Laboratório</h2>
<p>Neste laboratório, você observará ARP de forma defensiva usando comandos locais. O objetivo é identificar o gateway, consultar a tabela ARP, gerar tráfego leve e interpretar a associação IP-MAC criada. Não há ataque, não há spoofing e não há alteração indevida de rede.</p>
