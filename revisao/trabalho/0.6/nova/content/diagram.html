
<section class="lesson-section lesson-section--diagram">

    <desc id="m00l06-desc">O diagrama mostra um cliente acessando uma aplicação cloud através de Wi-Fi, firewall, internet e load balancer, destacando latência, largura de banda, throughput, perda e filas.</desc>
    <defs>
      <marker id="m00l06-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">

      </marker>
    </defs>
    <rect x="30" y="150" width="130" height="70" rx="12" class="svg-node svg-node--client" />
    <text x="95" y="180" text-anchor="middle" class="svg-label">Cliente</text>

    <rect x="210" y="150" width="130" height="70" rx="12" class="svg-node svg-node--firewall" />
    <text x="275" y="180" text-anchor="middle" class="svg-label">Firewall</text>
    <text x="275" y="203" text-anchor="middle" class="svg-label svg-label--small">fila/inspeção</text>

    <text x="690" y="180" text-anchor="middle" class="svg-label">Load balancer</text>
    <text x="690" y="203" text-anchor="middle" class="svg-label svg-label--small">cloud</text>
    <rect x="820" y="150" width="130" height="70" rx="12" class="svg-node svg-node--server" />
    <text x="885" y="180" text-anchor="middle" class="svg-label">Aplicação</text>
    <text x="885" y="203" text-anchor="middle" class="svg-label svg-label--small">resposta</text>

    <rect x="365" y="50" width="250" height="58" rx="10" class="svg-zone" />
