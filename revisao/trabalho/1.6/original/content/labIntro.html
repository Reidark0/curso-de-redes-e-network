  <h2>15. Laboratório</h2>
  <p>O laboratório desta aula é um inventário guiado de cabeamento. Ele pode ser feito em casa, em laboratório ou em ambiente corporativo com autorização. A ideia é mapear um caminho físico de rede e produzir evidências sem desconectar cabos críticos.</p>
