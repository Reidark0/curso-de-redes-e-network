<section class="lesson-section lesson-section--diagram"><h2>Diagrama SVG</h2>
<svg class="lesson-svg" viewBox="0 0 980 420" role="img" aria-labelledby="m03l02-title m03l02-desc">
<title id="m03l02-title">Frame Ethernet e endereço MAC</title>
<desc id="m03l02-desc">Diagrama mostra um host enviando um frame Ethernet para o gateway através de um switch, com campos de MAC de destino, MAC de origem, EtherType, payload e FCS.</desc>
<defs><marker id="m03l02-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" class="svg-arrow"></path></marker></defs>
<rect x="40" y="90" width="150" height="70" rx="12" class="svg-node svg-node--client"></rect><text x="115" y="130" text-anchor="middle" class="svg-label">Host</text><text x="115" y="150" text-anchor="middle" class="svg-label svg-label--small">MAC A</text>
<rect x="410" y="90" width="160" height="70" rx="12" class="svg-node svg-node--switch"></rect><text x="490" y="130" text-anchor="middle" class="svg-label">Switch</text><text x="490" y="150" text-anchor="middle" class="svg-label svg-label--small">Tabela MAC</text>
<rect x="790" y="90" width="150" height="70" rx="12" class="svg-node svg-node--router"></rect><text x="865" y="130" text-anchor="middle" class="svg-label">Gateway</text><text x="865" y="150" text-anchor="middle" class="svg-label svg-label--small">MAC B</text>
<line x1="190" y1="125" x2="410" y2="125" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m03l02-arrow)"></line>
<line x1="570" y1="125" x2="790" y2="125" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m03l02-arrow)"></line>
<rect x="100" y="240" width="125" height="52" rx="8" class="svg-node"></rect><text x="162" y="270" text-anchor="middle" class="svg-label svg-label--small">Dst MAC B</text>
<rect x="225" y="240" width="125" height="52" rx="8" class="svg-node"></rect><text x="287" y="270" text-anchor="middle" class="svg-label svg-label--small">Src MAC A</text>
<rect x="350" y="240" width="115" height="52" rx="8" class="svg-node"></rect><text x="407" y="270" text-anchor="middle" class="svg-label svg-label--small">EtherType</text>
<rect x="465" y="240" width="245" height="52" rx="8" class="svg-node svg-node--server"></rect><text x="587" y="270" text-anchor="middle" class="svg-label svg-label--small">Payload: IP / ARP / IPv6</text>
<rect x="710" y="240" width="95" height="52" rx="8" class="svg-node svg-node--security"></rect><text x="757" y="270" text-anchor="middle" class="svg-label svg-label--small">FCS</text>
<text x="490" y="220" text-anchor="middle" class="svg-label">Frame Ethernet: envelope local da LAN</text>
<path d="M160 292 C240 360, 710 360, 760 292" class="svg-flow svg-flow--response" marker-end="url(#m03l02-arrow)"></path>
<text x="490" y="385" text-anchor="middle" class="svg-label svg-label--small">A cada salto roteado, os MACs locais podem mudar; o IP de origem/destino permanece no pacote.</text>
</svg>
