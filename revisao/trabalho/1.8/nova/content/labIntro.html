  <h2>15. Laboratório</h2>
  <p>O laboratório desta aula é uma coleta segura de métricas básicas. O objetivo não é fazer teste agressivo nem estressar redes de terceiros. O objetivo é aprender a registrar evidências de latência, rota, resolução de nome, tempo HTTP e disponibilidade percebida.</p>
