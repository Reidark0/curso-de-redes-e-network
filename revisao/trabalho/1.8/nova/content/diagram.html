<section class="lesson-section lesson-section--diagram">
  <h2>Diagrama</h2>
  <p>O diagrama separa métricas que parecem semelhantes, mas medem coisas diferentes: tempo, variação, perda, vazão útil e disponibilidade.</p>
  <svg class="lesson-svg" viewBox="0 0 980 500" role="img" aria-labelledby="m01l08-title m01l08-desc">
    <title id="m01l08-title">Métricas de rede no caminho entre cliente e serviço</title>
    <desc id="m01l08-desc">Cliente envia tráfego por switch, firewall, WAN e servidor. O diagrama destaca latência, jitter, perda, throughput e disponibilidade.</desc>
    <defs>
      <marker id="m01l08-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" class="svg-arrow" />
      </marker>
    </defs>
    <rect x="40" y="90" width="140" height="70" rx="12" class="svg-node svg-node--client" />
    <text x="110" y="130" text-anchor="middle" class="svg-label">Cliente</text>
    <rect x="240" y="90" width="140" height="70" rx="12" class="svg-node svg-node--switch" />
    <text x="310" y="130" text-anchor="middle" class="svg-label">Switch</text>
    <rect x="440" y="90" width="140" height="70" rx="12" class="svg-node svg-node--firewall" />
    <text x="510" y="130" text-anchor="middle" class="svg-label">Firewall</text>
    <rect x="640" y="90" width="140" height="70" rx="12" class="svg-node svg-node--cloud" />
    <text x="710" y="130" text-anchor="middle" class="svg-label">WAN/Cloud</text>
    <rect x="820" y="90" width="120" height="70" rx="12" class="svg-node svg-node--server" />
    <text x="880" y="130" text-anchor="middle" class="svg-label">Serviço</text>

    <line x1="180" y1="125" x2="240" y2="125" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l08-arrow)" />
    <line x1="380" y1="125" x2="440" y2="125" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l08-arrow)" />
    <line x1="580" y1="125" x2="640" y2="125" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l08-arrow)" />
    <line x1="780" y1="125" x2="820" y2="125" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l08-arrow)" />

    <path d="M880 170 C760 235, 510 235, 110 170" class="svg-flow svg-flow--response" marker-end="url(#m01l08-arrow)" />
    <text x="500" y="245" text-anchor="middle" class="svg-label">RTT: ida + processamento + volta</text>

    <rect x="75" y="300" width="165" height="85" rx="12" class="svg-node svg-node--security" />
    <text x="157" y="326" text-anchor="middle" class="svg-label">Latência</text>
    <text x="157" y="352" text-anchor="middle" class="svg-label svg-label--small">tempo por operação</text>
    <text x="157" y="374" text-anchor="middle" class="svg-label svg-label--small">ms / RTT</text>

    <rect x="285" y="300" width="165" height="85" rx="12" class="svg-node svg-node--security" />
    <text x="367" y="326" text-anchor="middle" class="svg-label">Jitter</text>
    <text x="367" y="352" text-anchor="middle" class="svg-label svg-label--small">variação da latência</text>
    <text x="367" y="374" text-anchor="middle" class="svg-label svg-label--small">voz e vídeo sofrem</text>

    <rect x="495" y="300" width="165" height="85" rx="12" class="svg-node svg-node--security" />
    <text x="577" y="326" text-anchor="middle" class="svg-label">Perda</text>
    <text x="577" y="352" text-anchor="middle" class="svg-label svg-label--small">pacotes não chegam</text>
    <text x="577" y="374" text-anchor="middle" class="svg-label svg-label--small">retransmissão/queda</text>

    <rect x="705" y="300" width="190" height="85" rx="12" class="svg-node svg-node--security" />
    <text x="800" y="326" text-anchor="middle" class="svg-label">Throughput</text>
    <text x="800" y="352" text-anchor="middle" class="svg-label svg-label--small">vazão útil real</text>
    <text x="800" y="374" text-anchor="middle" class="svg-label svg-label--small">menor que a banda nominal</text>

    <line x1="110" y1="405" x2="880" y2="405" class="svg-flow svg-flow--blocked" />
    <text x="500" y="438" text-anchor="middle" class="svg-label">Disponibilidade: capacidade de o serviço estar acessível no período combinado</text>
  </svg>
</section>
