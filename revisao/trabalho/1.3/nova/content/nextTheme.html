  <p>Depois de classificar tipos de rede, o próximo passo é entender topologias físicas e lógicas. Duas redes podem ser do mesmo tipo, por exemplo LAN, mas ter desenhos muito diferentes: estrela, malha, barramento lógico, hub-and-spoke, spine-leaf ou topologia virtual em cloud.</p>
