
<section class="lesson-section lesson-section--diagram">
  <h2>14. Diagrama SVG</h2>
  <svg class="lesson-svg" viewBox="0 0 1000 430" role="img" aria-labelledby="m00l04-title m00l04-desc">
    <title id="m00l04-title">Relação entre Mbps, MB/s, overhead e throughput útil</title>
    <desc id="m00l04-desc">Diagrama mostrando um link anunciado em Mbps, conversão para MB/s, perda por overhead e entrega de throughput útil para a aplicação.</desc>
    <defs>
      <marker id="m00l04-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" class="svg-arrow" />
      </marker>
    </defs>
    <rect x="40" y="70" width="170" height="78" rx="12" class="svg-node svg-node--cloud" />
    <text x="125" y="102" text-anchor="middle" class="svg-label">Link nominal</text>
    <text x="125" y="128" text-anchor="middle" class="svg-label svg-label--small">500 Mbps</text>
    <rect x="280" y="70" width="190" height="78" rx="12" class="svg-node" />
    <text x="375" y="102" text-anchor="middle" class="svg-label">Conversão</text>
    <text x="375" y="128" text-anchor="middle" class="svg-label svg-label--small">500 ÷ 8 = 62,5 MB/s</text>
    <rect x="550" y="70" width="190" height="78" rx="12" class="svg-node svg-node--firewall" />
    <text x="645" y="102" text-anchor="middle" class="svg-label">Overhead</text>
    <text x="645" y="128" text-anchor="middle" class="svg-label svg-label--small">Ethernet + IP + TCP + TLS</text>
    <rect x="810" y="70" width="150" height="78" rx="12" class="svg-node svg-node--server" />
    <text x="885" y="102" text-anchor="middle" class="svg-label">Aplicação</text>
    <text x="885" y="128" text-anchor="middle" class="svg-label svg-label--small">55 MB/s úteis</text>
    <line x1="210" y1="109" x2="280" y2="109" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m00l04-arrow)" />
    <line x1="470" y1="109" x2="550" y2="109" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m00l04-arrow)" />
    <line x1="740" y1="109" x2="810" y2="109" class="svg-flow svg-flow--response animated-flow" marker-end="url(#m00l04-arrow)" />
    <rect x="110" y="245" width="230" height="86" rx="12" class="svg-node svg-node--client" />
    <text x="225" y="278" text-anchor="middle" class="svg-label">Download observado</text>
    <text x="225" y="304" text-anchor="middle" class="svg-label svg-label--small">55 MB/s × 8 = 440 Mbps</text>
    <rect x="390" y="245" width="230" height="86" rx="12" class="svg-node svg-node--security" />
    <text x="505" y="278" text-anchor="middle" class="svg-label">Diagnóstico</text>
    <text x="505" y="304" text-anchor="middle" class="svg-label svg-label--small">converter antes de concluir</text>
    <rect x="670" y="245" width="230" height="86" rx="12" class="svg-node svg-node--attacker" />
    <text x="785" y="278" text-anchor="middle" class="svg-label">Risco</text>
    <text x="785" y="304" text-anchor="middle" class="svg-label svg-label--small">unidade errada = decisão errada</text>
    <line x1="885" y1="148" x2="225" y2="245" class="svg-flow svg-flow--response animated-flow" marker-end="url(#m00l04-arrow)" />
    <line x1="340" y1="288" x2="390" y2="288" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m00l04-arrow)" />
    <line x1="620" y1="288" x2="670" y2="288" class="svg-flow svg-flow--blocked animated-flow" marker-end="url(#m00l04-arrow)" />
    <text x="500" y="390" text-anchor="middle" class="svg-label">A velocidade nominal do link não é igual à taxa útil vista pela aplicação.</text>
  </svg>
</section>
