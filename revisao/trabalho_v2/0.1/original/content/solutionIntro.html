  <h2>18. Solução comentada</h2>
  <p>
    A solução comentada não deve apenas dizer “tudo vira bit”. Ela deve mostrar o raciocínio correto: intenção humana, dado de aplicação, codificação, bytes, bits, sinal físico, transporte, reconstrução e interpretação no destino.</p>
