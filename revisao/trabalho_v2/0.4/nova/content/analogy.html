
<section class="lesson-section lesson-section--analogy">
  <h2>Analogia</h2>
  <p>
    Pense numa estrada com caminhões de entrega. A capacidade da estrada é o link em Mbps, e a carga dos caminhões é o arquivo, medido em bytes. Os caminhões também levam documentos, lacres e etiquetas, que não são a carga mas são necessários para a entrega: isso é o overhead.
  </p>
</section>
