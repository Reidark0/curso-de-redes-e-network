<section class="lesson-section lesson-section--diagram">
  <h2>14. Diagrama SVG</h2>
  <p>O diagrama mostra a mudança principal: no datacenter tradicional, a rede era construída como equipamentos físicos e cabos. Na cloud, você continua desenhando isolamento, rotas, publicação, segurança e observabilidade, mas faz isso por APIs e objetos lógicos do provedor.</p>

    <desc id="cloud-net-desc">Datacenter tradicional com switches e firewall conectado a uma VPC ou VNet com sub-redes pública e privada, gateway, NAT, load balancer, security groups e flow logs.</desc>
    <defs>
      <marker id="arrow-cloud-1401" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">

    </defs>

    <rect x="30" y="60" width="360" height="400" rx="18" class="svg-zone" />
    <text x="210" y="95" text-anchor="middle" class="svg-label">Datacenter tradicional</text>

    <rect x="70" y="140" width="110" height="62" rx="12" class="svg-node svg-node--switch" />
