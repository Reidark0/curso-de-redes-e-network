  <h2>Analogia</h2>
  <p>Pense na Camada 1 como a estrada por onde a carga passa: mesmo com endereço e documentos corretos, a entrega falha se a ponte caiu. A diferença é que o sinal não chega intacto como um caminhão: o receptor reconstrói os bits a partir de um sinal enfraquecido e com ruído.</p>
