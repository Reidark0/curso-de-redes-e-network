  <h2>14. Diagrama SVG</h2>
  <p>O diagrama abaixo mostra a ideia central: a mensagem da aplicação desce pela pilha, ganha cabeçalhos e vira uma PDU diferente em cada grupo de camadas; no destino, o processo é invertido.</p>

    <title id="m02l02-title">Encapsulamento e desencapsulamento no Modelo OSI</title>
    <desc id="m02l02-desc">Cliente encapsula dados em segmento, pacote, quadro e bits; servidor desencapsula na ordem inversa.</desc>
    <defs>
      <marker id="m02l02-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" class="svg-arrow" />
      </marker>
    </defs>

    <rect x="40" y="40" width="250" height="420" rx="18" class="svg-zone" />
    <text x="165" y="75" text-anchor="middle" class="svg-label">Origem: encapsula</text>

    <rect x="670" y="40" width="250" height="420" rx="18" class="svg-zone" />
    <text x="795" y="75" text-anchor="middle" class="svg-label">Destino: desencapsula</text>

    <rect x="90" y="365" width="150" height="46" rx="10" class="svg-node" />

    <text x="480" y="245" text-anchor="middle" class="svg-label">Rede</text>
    <text x="480" y="276" text-anchor="middle" class="svg-label svg-label--small">Switches, roteadores, firewalls</text>
