<section class="lesson-section lesson-section--analogy">
  <h2>Analogia</h2>
  <p>Mapear uma rede é como mapear um hospital: não basta saber que existe uma recepção; é preciso saber onde ficam as salas, quais corredores ligam os setores e quais portas são restritas. A diferença é que a rede muda sozinha, todos os dias, por isso cada informação do mapa leva data.</p>
