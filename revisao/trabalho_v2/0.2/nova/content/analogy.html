
<section class="lesson-section lesson-section--analogy">
  <h2>Analogia</h2>
  <p>
    A mesma quantia de dinheiro pode ser dita (“cento e noventa e dois reais”), escrita (<code>192</code>) ou separada em notas (100 + 50 + 20 + 20 + 2). A quantia não muda; muda só a forma de registrar. Com bases é igual: <code>192</code>, <code>11000000</code> e <code>C0</code> são o mesmo valor.
  </p>
</section>
