  <h2>Analogia</h2>
  <p>
    Imagine mandar uma mensagem com uma lanterna: piscada curta é 0, piscada longa é 1. Se a outra pessoa conhece o código e vê a luz com clareza, reconstrói a mensagem. Com neblina, muita distância ou outra luz piscando ao lado, ela confunde as piscadas e lê errado.</p>
