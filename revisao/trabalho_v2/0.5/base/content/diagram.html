
<section class="lesson-section lesson-section--diagram">
  <h2>Diagrama SVG</h2>
  <p>
    O mesmo dado lógico — os bits <code>10110010</code> — pode atravessar três meios, desde que seja convertido em variação elétrica, de luz ou eletromagnética. Os três estão sujeitos a ruído, atenuação e interferência.
  </p>

      <marker id="m00l05-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">

    </defs>

    <rect x="35" y="170" width="145" height="80" rx="14" class="svg-node svg-node--client" />
    <text x="107" y="198" text-anchor="middle" class="svg-label">Transmissor</text>
    <text x="107" y="224" text-anchor="middle" class="svg-label svg-label--small">bits: 10110010</text>
