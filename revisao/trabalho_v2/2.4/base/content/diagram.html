<section class="lesson-section lesson-section--diagram">
  <h2>Diagrama SVG</h2>
  <svg class="lesson-svg" viewBox="0 0 980 520" role="img" aria-labelledby="m02l04-title m02l04-desc">
    <title id="m02l04-title">Camada 2: quadro Ethernet, switch, tabela MAC, VLAN e ARP</title>
    <desc id="m02l04-desc">Diagrama mostrando dois hosts em VLANs, um switch aprendendo endereços MAC, ARP resolvendo IP para MAC e o limite entre domínio de broadcast e roteamento.</desc>
    <defs>
      <marker id="m02l04-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" class="svg-arrow" />
      </marker>
    </defs>
    <rect x="30" y="40" width="920" height="420" rx="18" class="svg-zone" />
    <text x="490" y="76" text-anchor="middle" class="svg-label">Domínio de Camada 2: switches, MAC, frames, VLANs e broadcast ARP</text>

    <rect x="70" y="140" width="150" height="82" rx="14" class="svg-node svg-node--client" />
    <text x="145" y="174" text-anchor="middle" class="svg-label">Host A</text>
    <text x="145" y="198" text-anchor="middle" class="svg-label svg-label--small">IP 192.168.10.10</text>
    <text x="145" y="216" text-anchor="middle" class="svg-label svg-label--small">MAC AA:AA</text>

    <rect x="390" y="122" width="200" height="120" rx="16" class="svg-node svg-node--switch" />
    <text x="490" y="156" text-anchor="middle" class="svg-label">Switch</text>
    <text x="490" y="182" text-anchor="middle" class="svg-label svg-label--small">Aprende MAC por porta</text>
    <text x="490" y="205" text-anchor="middle" class="svg-label svg-label--small">Encaminha frames</text>
    <text x="490" y="228" text-anchor="middle" class="svg-label svg-label--small">Separa VLANs</text>

    <rect x="760" y="140" width="150" height="82" rx="14" class="svg-node svg-node--server" />
    <text x="835" y="174" text-anchor="middle" class="svg-label">Host B</text>
    <text x="835" y="198" text-anchor="middle" class="svg-label svg-label--small">IP 192.168.10.20</text>
    <text x="835" y="216" text-anchor="middle" class="svg-label svg-label--small">MAC BB:BB</text>

    <line x1="220" y1="180" x2="390" y2="180" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m02l04-arrow)" />
    <line x1="590" y1="180" x2="760" y2="180" class="svg-flow svg-flow--response animated-flow" marker-end="url(#m02l04-arrow)" />
    <text x="305" y="155" text-anchor="middle" class="svg-label svg-label--small">Frame Ethernet</text>
    <text x="675" y="155" text-anchor="middle" class="svg-label svg-label--small">Unicast se o MAC é conhecido</text>

    <rect x="95" y="300" width="250" height="88" rx="14" class="svg-node svg-node--security" />
    <text x="220" y="329" text-anchor="middle" class="svg-label">ARP Request</text>
    <text x="220" y="352" text-anchor="middle" class="svg-label svg-label--small">Quem tem 192.168.10.20?</text>
    <text x="220" y="374" text-anchor="middle" class="svg-label svg-label--small">Broadcast dentro da VLAN</text>

    <rect x="635" y="300" width="250" height="88" rx="14" class="svg-node svg-node--security" />
    <text x="760" y="329" text-anchor="middle" class="svg-label">Tabela MAC</text>
    <text x="760" y="352" text-anchor="middle" class="svg-label svg-label--small">AA:AA → porta 1</text>
    <text x="760" y="374" text-anchor="middle" class="svg-label svg-label--small">BB:BB → porta 2</text>

    <path d="M220 300 C260 260 350 248 430 238" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m02l04-arrow)" />
    <path d="M590 238 C650 250 710 270 760 300" class="svg-flow svg-flow--response animated-flow" marker-end="url(#m02l04-arrow)" />

    <line x1="490" y1="242" x2="490" y2="445" class="svg-boundary" />
    <text x="515" y="425" class="svg-label svg-label--small">Limite lógico: VLAN / domínio de broadcast</text>
  </svg>
