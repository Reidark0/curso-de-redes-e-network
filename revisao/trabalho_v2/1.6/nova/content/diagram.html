<section class="lesson-section lesson-section--diagram">

      </marker>
    </defs>
    <rect x="30" y="95" width="135" height="72" rx="12" class="svg-node svg-node--client" />
    <text x="97" y="125" text-anchor="middle" class="svg-label">Notebook</text>
    <text x="97" y="148" text-anchor="middle" class="svg-label svg-label--small">dispositivo final</text>
    <rect x="220" y="95" width="135" height="72" rx="12" class="svg-node" />

    <rect x="790" y="95" width="135" height="72" rx="12" class="svg-node svg-node--switch" />
    <text x="857" y="125" text-anchor="middle" class="svg-label">Switch</text>
    <text x="857" y="148" text-anchor="middle" class="svg-label svg-label--small">porta, velocidade, PoE</text>
    <line x1="165" y1="131" x2="220" y2="131" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l06-arrow)" />
