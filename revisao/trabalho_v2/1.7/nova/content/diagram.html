<section class="lesson-section lesson-section--diagram">
  <h2>Diagrama SVG</h2>
  <svg class="lesson-svg" viewBox="0 0 1100 520" role="img" aria-labelledby="m01l07-title m01l07-desc">
    <title id="m01l07-title">Papéis dos equipamentos de rede</title>
    <desc id="m01l07-desc">Um notebook, pela sua NIC, liga-se a um switch, que lê endereços MAC. O switch também liga um servidor local e um access point, que atende um celular pelo rádio. Do switch, o tráfego para fora vai ao roteador, que lê o IP de destino, e ao firewall, que compara com regras, antes de chegar à internet. Um hub aparece à parte como equipamento legado que repete o sinal em todas as portas.</desc>
    <defs>
      <marker id="m01l07-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" class="svg-arrow" />
      </marker>
    </defs>

    <rect x="30" y="85" width="160" height="72" rx="14" class="svg-node svg-node--client" />
    <text x="110" y="116" text-anchor="middle" class="svg-label">Notebook</text>
    <text x="110" y="140" text-anchor="middle" class="svg-label svg-label--small">NIC: placa de rede</text>

    <rect x="250" y="85" width="160" height="72" rx="14" class="svg-node svg-node--switch" />
    <text x="330" y="116" text-anchor="middle" class="svg-label">Switch</text>
    <text x="330" y="140" text-anchor="middle" class="svg-label svg-label--small">lê MAC · tabela MAC</text>

    <rect x="470" y="85" width="160" height="72" rx="14" class="svg-node svg-node--router" />
    <text x="550" y="116" text-anchor="middle" class="svg-label">Roteador</text>
    <text x="550" y="140" text-anchor="middle" class="svg-label svg-label--small">lê IP · tabela de rotas</text>

    <rect x="690" y="85" width="160" height="72" rx="14" class="svg-node svg-node--firewall" />
    <text x="770" y="116" text-anchor="middle" class="svg-label">Firewall</text>
    <text x="770" y="140" text-anchor="middle" class="svg-label svg-label--small">compara com regras</text>

    <rect x="910" y="85" width="160" height="72" rx="14" class="svg-node svg-node--cloud" />
    <text x="990" y="116" text-anchor="middle" class="svg-label">Internet</text>
    <text x="990" y="140" text-anchor="middle" class="svg-label svg-label--small">outras redes</text>

    <rect x="30" y="255" width="160" height="72" rx="14" class="svg-node" />
    <text x="110" y="286" text-anchor="middle" class="svg-label">Access point</text>
    <text x="110" y="310" text-anchor="middle" class="svg-label svg-label--small">rádio ↔ cabo</text>

    <rect x="30" y="410" width="160" height="72" rx="14" class="svg-node svg-node--client" />
    <text x="110" y="441" text-anchor="middle" class="svg-label">Celular</text>
    <text x="110" y="465" text-anchor="middle" class="svg-label svg-label--small">cliente Wi‑Fi</text>

    <rect x="250" y="255" width="160" height="72" rx="14" class="svg-node svg-node--server" />
    <text x="330" y="286" text-anchor="middle" class="svg-label">Servidor</text>
    <text x="330" y="310" text-anchor="middle" class="svg-label svg-label--small">mesma rede local</text>

    <line x1="190" y1="121" x2="250" y2="121" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l07-arrow)" />
    <line x1="410" y1="121" x2="470" y2="121" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l07-arrow)" />
    <line x1="630" y1="121" x2="690" y2="121" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l07-arrow)" />
    <line x1="850" y1="121" x2="910" y2="121" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l07-arrow)" />
    <line x1="330" y1="157" x2="330" y2="255" class="svg-flow svg-flow--response animated-flow" marker-end="url(#m01l07-arrow)" />
    <line x1="190" y1="275" x2="285" y2="157" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l07-arrow)" />
    <line x1="110" y1="410" x2="110" y2="327" class="svg-flow svg-flow--request animated-flow" marker-end="url(#m01l07-arrow)" />
    <text x="160" y="375" text-anchor="middle" class="svg-label svg-label--small">rádio</text>

    <rect x="690" y="225" width="380" height="120" rx="14" class="svg-boundary" />
    <text x="880" y="248" text-anchor="middle" class="svg-label svg-label--small">Legado: fora das redes modernas</text>
    <rect x="800" y="260" width="160" height="72" rx="14" class="svg-node" />
    <text x="880" y="291" text-anchor="middle" class="svg-label">Hub</text>
    <text x="880" y="315" text-anchor="middle" class="svg-label svg-label--small">repete em todas as portas</text>

    <rect x="470" y="395" width="380" height="80" rx="14" class="svg-node svg-node--security" />
    <text x="660" y="425" text-anchor="middle" class="svg-label">Pergunta de diagnóstico</text>
    <text x="660" y="450" text-anchor="middle" class="svg-label svg-label--small">Quem liga, repete, comuta, roteia,</text>
    <text x="660" y="470" text-anchor="middle" class="svg-label svg-label--small">dá acesso sem fio ou aplica regras?</text>

    <text x="550" y="505" text-anchor="middle" class="svg-label svg-label--small">No roteador de casa, switch, AP, roteador e firewall básico ficam na mesma caixa; os papéis continuam separados.</text>
  </svg>
</section>
