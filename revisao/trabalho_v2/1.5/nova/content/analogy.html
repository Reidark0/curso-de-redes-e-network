<section class="lesson-section lesson-section--analogy">
  <h2>Analogia</h2>
  <p>Pense nos meios como caminhos para entregar mensagens. O cobre é uma rua do bairro: barata e prática, mas boa só para trechos curtos. A fibra é uma rodovia expressa entre cidades. O rádio é falar por alto-falante num salão aberto: todos ouvem, só um fala de cada vez e o barulho atrapalha.</p>
</section>
