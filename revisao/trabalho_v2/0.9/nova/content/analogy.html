
<section class="lesson-section lesson-section--analogy">
  <h2>Analogia</h2>
  <p>
    Pense numa encomenda atrasada. Dizer “os Correios estão ruins” não ajuda; o rastreio mostra se o pacote saiu, por quais centros passou, onde parou e se o prédio recusou a entrega. Cada linha do rastreio é uma evidência com limite: “saiu do centro de distribuição” não prova que chegou.
  </p>
</section>
